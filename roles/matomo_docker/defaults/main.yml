---
# copyright Utrecht University

matomo_user: matomo
matomo_branch: main

matomo_host_name: dev.matomo.test
matomo_host_ip: 192.168.60.10
matomo_host_port: 443

matomo_first_site_name: test
matomo_first_site_url: https://yoda.uu.nl
matomo_first_user_name: admin
matomo_first_user_email: yoda@uu.nl
matomo_first_user_password: adminadmin
matomo_cors_domains: https://yoda.uu.nl

matomo_mysql_password: testtest
matomo_mysql_root_password: testtest

# MTA role can be either "mailpit" or "postfix"
matomo_mta_role: mailpit

matomo_postfix_relayhost_fqdn: notspecified
matomo_postfix_relayhost_port: 25
matomo_postfix_relayhost_username: changeme
matomo_postfix_relayhost_password: changeme
matomo_postfix_relayhost_auth_enabled: "yes"
matomo_postfix_relayhost_tls_enabled: "yes"
matomo_postfix_myhostname: changeme
matomo_postfix_origin: changeme
matomo_mail_from_address: matomo@changeme.nl

# Cert mode can be static or self-signed
matomo_cert_mode: selfsigned
matomo_static_cert: notset
matomo_static_cert_key: notset

# Archiving configuration
matomo_archiving_enabled: true
matomo_container_name: matomo
matomo_container_user: www-data
matomo_console_path: /var/www/html/matomo/console

matomo_archive_script_path: /home/{{ matomo_user }}/matomo-archive/matomo-archive.sh
matomo_archive_log_dir: "/home/{{ matomo_user }}/log"
matomo_archive_log_file: "{{ matomo_archive_log_dir }}/archive.log"
matomo_archive_lock_file: "/home/{{ matomo_user }}/matomo-archive/archive.lock"

# Archiving cron schedule (default: hourly at minute 5)
matomo_archive_cron_minute: "5"
matomo_archive_cron_hour: "*"
matomo_archive_cron_day: "*"
matomo_archive_cron_month: "*"
matomo_archive_cron_weekday: "*"
